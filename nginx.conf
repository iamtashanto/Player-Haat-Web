# Static hosting for dist/ (the PlayerHaat website).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # The app uses hash routing, so every path is the same document; entry files must never be cached.
  location = /index.html { add_header Cache-Control "no-store"; }
  location = /flutter_bootstrap.js { add_header Cache-Control "no-store"; }
  location = /version.json { add_header Cache-Control "no-store"; }

  location ~* \.(js|wasm|css|png|jpg|svg|ico|otf|ttf|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  location / { try_files $uri $uri/ /index.html; }
}
